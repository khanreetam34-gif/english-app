name: Extract V41 Project

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract V41 ZIP
        run: |
          mkdir -p /tmp/v41
          unzip -o "English_Rebuild_v41_phone_build.zip" -d /tmp/v41

      - name: Copy V41 project files
        run: |
          rsync -av --exclude='.github/' /tmp/v41/ ./

      - name: Remove ZIP
        run: |
          rm -f "English_Rebuild_v41_phone_build.zip"

      - name: Show extracted files
        run: |
          echo "===== V41 PROJECT ====="
          find . -maxdepth 3 -type f | sort | head -200

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Extract V41 English project"
            git push
          fi
